name: Release

# Публикация новой версии: поднимите version в package.json, затем
#   git tag v1.1.0 && git push origin v1.1.0
# Сборка соберётся на чистой машине GitHub и попадёт в Releases вместе с latest.yml,
# по которому установленные лаунчеры увидят обновление.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка и публикация в GitHub Releases
        run: npm run release
        env:
          # Токен выдаётся Actions автоматически, заводить свой не нужно
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
